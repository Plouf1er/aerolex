<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tpo" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tpo">La polaire : portance contre train&#233;e</title>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="26" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">La polaire : ce que l'aile donne, ce qu'elle co&#251;te</text>
<text x="320" y="45" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Chaque point de la courbe = une incidence de vol diff&#233;rente</text>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.ax{stroke:#1e3a5f;stroke-width:2}
.gr{stroke:#cbd5e1;stroke-width:0.8}
.lb{font-family:Arial;font-size:11.5px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12px;font-weight:700;cursor:pointer;fill:#1e3a5f}
</style>
<rect class="cad" x="16" y="58" width="380" height="270" rx="6"/>
<!-- grille -->
<g class="gr">
<line x1="90" y1="290" x2="370" y2="290"/><line x1="90" y1="250" x2="370" y2="250"/>
<line x1="90" y1="210" x2="370" y2="210"/><line x1="90" y1="170" x2="370" y2="170"/>
<line x1="90" y1="130" x2="370" y2="130"/>
<line x1="150" y1="90" x2="150" y2="290"/><line x1="210" y1="90" x2="210" y2="290"/>
<line x1="270" y1="90" x2="270" y2="290"/><line x1="330" y1="90" x2="330" y2="290"/>
</g>
<!-- axes -->
<line class="ax" x1="90" y1="290" x2="376" y2="290"/>
<line class="ax" x1="90" y1="290" x2="90" y2="86"/>
<text class="aerolex-terme" data-slug="coefficient-de-portance" x="26" y="80">Cz</text>
<text class="lb" x="26" y="96" font-size="10">portance</text>
<text class="aerolex-terme" data-slug="coefficient-de-trainee" x="336" y="316">Cx</text>
<text class="lb" x="300" y="332" font-size="10">tra&#238;n&#233;e &#8594;</text>

<!-- courbe polaire -->
<path d="M112 282 Q130 210 176 158 Q220 116 268 112 Q310 116 330 152" fill="none" stroke="#2563eb" stroke-width="3.2"/>

<!-- point de finesse max : tangente depuis l'origine -->
<line x1="90" y1="290" x2="230" y2="132" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="196" cy="140" r="6" fill="#16a34a"/>
<text class="lb" x="206" y="136" fill="#16a34a" font-weight="700" font-size="11">finesse max</text>
<text class="lb" x="206" y="150" font-size="10" fill="#64748b">meilleur rapport</text>

<!-- sommet = Cz max -->
<circle cx="268" cy="112" r="6" fill="#dc2626"/>
<text class="lb" x="278" y="106" fill="#dc2626" font-weight="700" font-size="11">Cz max</text>
<text class="lb" x="278" y="120" font-size="10" fill="#64748b">juste avant le d&#233;crochage</text>

<!-- zone apres decrochage -->
<text class="lb" x="330" y="176" font-size="10" fill="#b45309">au-del&#224; : d&#233;crochage</text>

<!-- lecture -->
<rect class="cad" x="404" y="58" width="220" height="270" rx="6"/>
<text class="lb" x="416" y="80" font-weight="700">Comment la lire</text>
<text class="lb" x="416" y="104" font-size="10.5">Chaque point = une <tspan class="aerolex-terme" data-slug="incidence" font-size="10.5">incidence</tspan>.</text>
<text class="lb" x="416" y="124" font-size="10.5">Monter sur la courbe = tirer</text>
<text class="lb" x="416" y="138" font-size="10.5">sur le manche, voler plus lent.</text>
<text class="lb" x="416" y="164" font-size="10.5" fill="#16a34a" font-weight="700">Finesse max</text>
<text class="lb" x="416" y="180" font-size="10.5">= le plus de chemin par</text>
<text class="lb" x="416" y="194" font-size="10.5">m&#232;tre perdu. Point cl&#233; en</text>
<text class="lb" x="416" y="208" font-size="10.5">cas de <tspan class="aerolex-terme" data-slug="panne-moteur" font-size="10.5">panne moteur</tspan>.</text>
<text class="lb" x="416" y="234" font-size="10.5" fill="#dc2626" font-weight="700">Cz max</text>
<text class="lb" x="416" y="250" font-size="10.5">= portance maximale.</text>
<text class="lb" x="416" y="264" font-size="10.5">Au-del&#224;, l'aile <tspan class="aerolex-terme" data-slug="decrochage" font-size="10.5">d&#233;croche</tspan>.</text>
<text class="lb" x="416" y="290" font-size="10.5" fill="#64748b">La courbe ne part pas de z&#233;ro :</text>
<text class="lb" x="416" y="304" font-size="10.5" fill="#64748b">m&#234;me sans portance, l'aile</text>
<text class="lb" x="416" y="318" font-size="10.5" fill="#64748b">tra&#238;ne d&#233;j&#224;.</text>

<rect class="cad" x="16" y="338" width="608" height="46" rx="6"/>
<text class="lb" x="28" y="358">La <tspan class="aerolex-terme" data-slug="polaire">polaire</tspan> r&#233;sume toute l'aile : &#224; gauche &#231;a tra&#238;ne peu, en haut &#231;a porte beaucoup.</text>
<text class="lb" x="28" y="376" font-size="10.5" fill="#64748b">On ne peut pas avoir les deux : choisir son incidence, c'est choisir son compromis.</text>
</svg>
