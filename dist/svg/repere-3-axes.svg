<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t">
<title id="t">Le repère des trois axes autour du centre de gravité</title>
<style>
.ax{stroke:#1b3a5c;stroke-width:2.5;fill:none}
.pl{fill:#dfe8f0;stroke:#1b3a5c;stroke-width:2}
.rot{stroke:#c1462c;stroke-width:2.2;fill:none;marker-end:url(#a)}
text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#1b3a5c}
.aerolex-terme{font-weight:bold;cursor:pointer}
.sub{font-size:12.5px;fill:#5a6b7a;font-weight:normal}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c1462c"/></marker></defs>
<!-- fuselage -->
<path class="pl" d="M120 210 h330 l40 -8 v16 l-40 -8"/>
<!-- ailes -->
<path class="pl" d="M250 210 l-30 -85 h34 l46 85 z"/>
<path class="pl" d="M250 210 l-30 85 h34 l46 -85 z"/>
<!-- empennage -->
<path class="pl" d="M132 210 l-8 -46 h16 l14 46z"/>
<!-- axes -->
<line class="ax" x1="80" y1="210" x2="560" y2="210" stroke-dasharray="7 5"/>
<line class="ax" x1="286" y1="60" x2="286" y2="370" stroke-dasharray="7 5"/>
<line class="ax" x1="150" y1="330" x2="430" y2="105" stroke-dasharray="7 5"/>
<circle cx="286" cy="210" r="6" fill="#1b3a5c"/>
<text class="aerolex-terme" data-slug="centre-de-gravite" x="296" y="234">centre de gravité</text>
<text class="aerolex-terme" data-slug="cg" x="296" y="252">(CG)</text>
<!-- rotations -->
<path class="rot" d="M470 186 a34 34 0 0 1 0 48"/>
<text class="aerolex-terme" data-slug="roulis" x="492" y="205">roulis</text>
<text class="sub" x="492" y="222">axe longitudinal</text>
<path class="rot" d="M262 96 a34 34 0 0 0 48 0"/>
<text class="aerolex-terme" data-slug="lacet" x="300" y="80">lacet</text>
<text class="sub" x="300" y="97">axe vertical</text>
<path class="rot" d="M366 140 a34 34 0 0 1 34 34"/>
<text class="aerolex-terme" data-slug="tangage" x="392" y="132">tangage</text>
<text class="sub" x="392" y="149">axe transversal</text>
<text class="aerolex-terme" data-slug="inertie" x="90" y="392">inertie</text>
<text class="sub" x="146" y="392">— résistance de la masse à chaque rotation</text>
</svg>
