<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tin" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tin">L'incidence : angle entre la corde et le vent relatif</title>
<defs>
<marker id="in-g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
<marker id="in-r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
</defs>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="26" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">L'incidence : l'angle que l'aile pr&#233;sente au vent</text>
<text x="320" y="45" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Coupe de l'aile vue de c&#244;t&#233; &#183; l'avion avance vers la DROITE</text>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.pr{fill:#dbe6f0;stroke:#1e3a5f;stroke-width:2.4}
.lb{font-family:Arial;font-size:11.5px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12.5px;font-weight:700;cursor:pointer;fill:#1e3a5f}
.corde{stroke:#7c3aed;stroke-width:2.4;stroke-dasharray:9 5}
</style>
<rect class="cad" x="16" y="58" width="608" height="232" rx="6"/>
<text x="26" y="78" font-family="Arial" font-size="11" font-weight="700" fill="#475569">VUE DE COTE &#183; COUPE D'AILE</text>

<!-- PROFIL : bord d'attaque ARRONDI a DROITE (x=520), bord de fuite POINTU a GAUCHE (x=180).
     L'avion avance vers la droite => le bord d'attaque doit etre a droite.
     Cabre : bord d'attaque (520,196) PLUS HAUT que bord de fuite (180,236). -->
<path class="pr" d="M520 196 Q460 168 300 200 Q220 216 180 236 Q300 238 400 224 Q480 212 520 196 Z"/>

<!-- CORDE : ligne droite bord d'attaque -> bord de fuite, en VIOLET (distincte du profil) -->
<line class="corde" x1="520" y1="196" x2="180" y2="236"/>
<text class="aerolex-terme" data-slug="corde" x="300" y="266" fill="#7c3aed">corde</text>
<text class="lb" x="300" y="282" font-size="10.5" fill="#64748b">ligne droite : bord d'attaque &#8594; bord de fuite</text>

<!-- reperes des deux bords -->
<circle cx="520" cy="196" r="5" fill="#dc2626"/>
<text class="lb" x="500" y="176" font-size="10.5" fill="#dc2626">bord d'attaque</text>
<circle cx="180" cy="236" r="5" fill="#dc2626"/>
<text class="lb" x="132" y="258" font-size="10.5" fill="#dc2626">bord de fuite</text>

<!-- VENT RELATIF : vient de la DROITE (oppose a la trajectoire), horizontal a y=196.
     La corde monte vers la droite => le vent passe AU-DESSOUS de la corde
     cote bord de fuite => incidence POSITIVE. -->
<line x1="612" y1="196" x2="534" y2="196" stroke="#16a34a" stroke-width="4" marker-end="url(#in-g)"/>
<text class="aerolex-terme" data-slug="vent-relatif" x="520" y="118" fill="#16a34a">vent relatif</text>
<text class="lb" x="520" y="134" font-size="10.5" fill="#64748b">il vient d'en face</text>
<line x1="576" y1="188" x2="560" y2="128" stroke="#16a34a" stroke-width="1" stroke-dasharray="3 3"/>
<!-- prolongement horizontal du vent, vers la gauche, pour materialiser l'angle -->
<line x1="520" y1="196" x2="300" y2="196" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4"/>

<!-- ARC alpha : entre la corde (violet) et l'horizontale du vent (vert), au bord d'attaque -->
<path d="M420 196 A 100 100 0 0 0 418 208" fill="none" stroke="#dc2626" stroke-width="2.6"/>
<text x="386" y="214" font-family="Arial" font-size="20" font-weight="700" fill="#dc2626">&#945;</text>
<text class="aerolex-terme" data-slug="incidence" x="330" y="176" fill="#dc2626">incidence</text>
<line x1="376" y1="182" x2="404" y2="200" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>

<!-- TRAJECTOIRE : vers la DROITE, opposee au vent relatif -->
<line x1="60" y1="118" x2="180" y2="118" stroke="#dc2626" stroke-width="3.4" marker-end="url(#in-r)"/>
<text class="aerolex-terme" data-slug="trajectoire" x="60" y="110" fill="#dc2626">trajectoire</text>
<text class="lb" x="60" y="140" font-size="10.5" fill="#64748b">l'avion va vers la droite &#8594;</text>

<text class="lb" x="26" y="102" font-size="10.5" fill="#64748b">Incidence POSITIVE : le vent passe SOUS la corde.</text>

<rect class="cad" x="16" y="300" width="608" height="62" rx="6"/>
<text class="lb" x="28" y="320" font-weight="700">Le <tspan class="aerolex-terme" data-slug="vent-relatif">vent relatif</tspan> est exactement OPPOS&#201; &#224; la <tspan class="aerolex-terme" data-slug="trajectoire">trajectoire</tspan> : l'avion va &#224; droite, le vent vient de droite.</text>
<text class="lb" x="28" y="338">L'<tspan class="aerolex-terme" data-slug="incidence">incidence</tspan> se mesure entre la <tspan class="aerolex-terme" data-slug="corde">corde</tspan> et ce vent &#8212; jamais par rapport &#224; l'horizon.</text>
<text class="lb" x="28" y="354" font-size="10.5" fill="#64748b">Le pilote la choisit au manche. Trop d'incidence &#8594; <tspan class="aerolex-terme" data-slug="decrochage" font-size="10.5">d&#233;crochage</tspan>. &#192; ne pas confondre avec l'<tspan class="aerolex-terme" data-slug="assiette" font-size="10.5">assiette</tspan> (par rapport &#224; l'horizon).</text>
<text x="320" y="386" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">Bord d'attaque arrondi &#224; l'avant (droite), bord de fuite effil&#233; &#224; l'arri&#232;re (gauche).</text>
</svg>
