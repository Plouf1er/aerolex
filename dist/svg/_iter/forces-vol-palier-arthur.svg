<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tf" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tf">Les quatre forces en vol en palier</title>
<defs>
<marker id="ff-b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
<marker id="ff-r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
<marker id="ff-g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
<marker id="ff-o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
</defs>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="26" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">Les quatre forces en vol en palier</text>
<text x="320" y="45" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Vitesse et altitude constantes : les forces s'&#233;quilibrent deux &#224; deux</text>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.vt{font-family:Arial;font-size:11px;font-weight:700;fill:#475569}
.av{fill:#cbd5e1;stroke:#1e3a5f;stroke-width:1.6}
.lb{font-family:Arial;font-size:12px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12.5px;font-weight:700;cursor:pointer}
</style>
<rect class="cad" x="16" y="58" width="608" height="230" rx="6"/>
<text class="vt" x="26" y="76">VUE DE COTE &#183; NEZ A DROITE</text>

<!-- avion vu de cote, nez a DROITE, aile haute -->
<path class="av" d="M232 176 L392 166 Q436 170 452 178 Q436 186 392 188 L232 180 Z"/>
<rect class="av" x="300" y="150" width="76" height="9"/>
<path class="av" d="M336 159 L342 166 L334 166 Z" fill="#94a3b8"/>
<path class="av" d="M232 176 L222 128 L246 128 L256 176 Z"/>
<rect class="av" x="228" y="172" width="42" height="8"/>
<circle class="av" cx="452" cy="178" r="4" fill="#94a3b8"/>
<text class="lb" x="446" y="152" fill="#16a34a" font-weight="700" font-size="11">nez</text>

<!-- PORTANCE : vers le haut, depuis l'aile -->
<line x1="338" y1="178" x2="338" y2="86" stroke="#2563eb" stroke-width="4" marker-end="url(#ff-b)"/>
<text class="aerolex-terme" data-slug="portance" x="348" y="92" fill="#2563eb">portance</text>
<text class="lb" x="348" y="108" font-size="10.5" fill="#64748b">l'aile porte l'avion</text>

<!-- POIDS : vers le bas, depuis le centre de gravite -->
<circle cx="338" cy="178" r="5.5" fill="#dc2626"/>
<line x1="338" y1="178" x2="338" y2="270" stroke="#dc2626" stroke-width="4" marker-end="url(#ff-r)"/>
<text class="aerolex-terme" data-slug="poids" x="348" y="258" fill="#dc2626">poids</text>
<text class="lb" x="348" y="274" font-size="10.5" fill="#64748b">appliqu&#233; au <tspan class="aerolex-terme" data-slug="centre-de-gravite" font-size="10.5">centre de gravit&#233;</tspan></text>

<!-- TRACTION : vers l'avant (droite) -->
<line x1="338" y1="178" x2="430" y2="178" stroke="#16a34a" stroke-width="4" marker-end="url(#ff-g)"/>
<text class="aerolex-terme" data-slug="traction" x="386" y="168" fill="#16a34a">traction</text>
<text class="lb" x="440" y="182" font-size="10.5" fill="#64748b">l'h&#233;lice tire &#8594;</text>

<!-- TRAINEE : vers l'arriere (gauche) -->
<line x1="338" y1="178" x2="246" y2="178" stroke="#b45309" stroke-width="4" marker-end="url(#ff-o)"/>
<text class="aerolex-terme" data-slug="trainee" x="248" y="168" fill="#b45309">tra&#238;n&#233;e</text>
<text class="lb" x="152" y="182" font-size="10.5" fill="#64748b">&#8592; l'air freine</text>

<!-- axes d'equilibre -->
<line x1="104" y1="178" x2="576" y2="178" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="338" y1="86" x2="338" y2="264" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4 4"/>

<!-- bandeau -->
<rect class="cad" x="16" y="298" width="608" height="60" rx="6"/>
<text class="lb" x="28" y="318" font-weight="700">En <tspan class="aerolex-terme" data-slug="vol-en-palier">vol en palier</tspan> stabilis&#233; : portance = poids, et traction = tra&#238;n&#233;e.</text>
<text class="lb" x="28" y="336" font-size="11">Les quatre fl&#232;ches partent du m&#234;me point et ont la M&#202;ME longueur : c'est &#231;a, l'&#233;quilibre.</text>
<text class="lb" x="28" y="352" font-size="10.5" fill="#64748b">Si la traction d&#233;passe la tra&#238;n&#233;e, l'avion acc&#233;l&#232;re. Si la portance d&#233;passe le poids, il monte.</text>
<text x="320" y="384" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">Quatre forces, deux couples : un vertical (porter) et un horizontal (avancer).</text>
</svg>
