<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="tv" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tv">Le virage : la portance s'incline et se partage</title>
<defs>
<marker id="vv-b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
<marker id="vv-r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
<marker id="vv-g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
</defs>
<rect width="640" height="420" fill="#e0f2fe" rx="8"/>
<text x="320" y="26" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">En virage, la portance s'incline et se partage en deux</text>
<text x="320" y="45" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">M&#234;me avion vu de l'arri&#232;re (on le suit) : &#224; plat, puis inclin&#233; &#224; droite</text>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.vt{font-family:Arial;font-size:11px;font-weight:700;fill:#475569}
.av{fill:#cbd5e1;stroke:#1e3a5f;stroke-width:1.4}
.lb{font-family:Arial;font-size:11.5px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12px;font-weight:700;fill:#1e3a5f;cursor:pointer}
.hz{stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:6 5}
</style>

<!-- ============ CADRE 1 : VOL A PLAT ============ -->
<rect class="cad" x="16" y="60" width="296" height="228" rx="6"/>
<text class="vt" x="26" y="78">VU DE L'ARRIERE &#183; AILES A PLAT</text>
<line class="hz" x1="26" y1="196" x2="302" y2="196"/>
<text class="lb" x="26" y="212" font-size="10" fill="#64748b">horizon</text>
<!-- avion de face, a plat -->
<path class="av" d="M162 172 L162 138 L166 138 L166 172 Z" stroke-width="1.2"/>
<rect class="av" x="152" y="168" width="24" height="4" stroke-width="1.2"/>
<rect class="av" x="104" y="176" width="120" height="9"/>
<circle class="av" cx="164" cy="192" r="12"/>
<!-- portance verticale = tout pour soutenir -->
<line x1="164" y1="176" x2="164" y2="96" stroke="#2563eb" stroke-width="3.4" marker-end="url(#vv-b)"/>
<text class="lb" x="172" y="104" fill="#2563eb" font-weight="700">portance</text>
<!-- poids -->
<line x1="164" y1="206" x2="164" y2="262" stroke="#dc2626" stroke-width="3" marker-end="url(#vv-r)"/>
<text class="lb" x="172" y="252" fill="#dc2626" font-weight="700">poids</text>
<text class="lb" x="26" y="278" font-size="10.5">La portance est verticale : elle soutient tout le poids.</text>

<!-- ============ CADRE 2 : EN VIRAGE ============ -->
<rect class="cad" x="328" y="60" width="296" height="228" rx="6"/>
<text class="vt" x="338" y="78">VU DE L'ARRIERE &#183; INCLIN&#201; A DROITE</text>
<line class="hz" x1="338" y1="196" x2="614" y2="196"/>
<text class="lb" x="338" y="212" font-size="10" fill="#64748b">horizon</text>
<!-- avion incline 30 deg autour de son centre -->
<g transform="rotate(30 476 192)">
<path class="av" d="M474 172 L474 138 L478 138 L478 172 Z" stroke-width="1.2"/>
<rect class="av" x="464" y="168" width="24" height="4" stroke-width="1.2"/>
<rect class="av" x="416" y="176" width="120" height="9"/>
<circle class="av" cx="476" cy="192" r="12"/>
</g>
<!-- portance inclinee, perpendiculaire aux ailes -->
<line x1="476" y1="176" x2="528" y2="86" stroke="#2563eb" stroke-width="3.4" marker-end="url(#vv-b)"/>
<text class="lb" x="534" y="80" fill="#2563eb" font-weight="700">portance</text>
<!-- decomposition : verticale + horizontale -->
<line x1="476" y1="176" x2="476" y2="106" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#vv-g)"/>
<text class="lb" x="398" y="108" fill="#16a34a" font-weight="700">soutient</text>
<line x1="476" y1="106" x2="528" y2="106" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#vv-r)"/>
<text class="lb" x="532" y="122" fill="#dc2626" font-weight="700">fait tourner</text>
<!-- angle d'inclinaison entre l'aile et l'horizon -->
<path d="M524 196 A 48 48 0 0 0 518 168" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
<text class="lb" x="530" y="186" fill="#7c3aed" font-weight="700">inclinaison</text>
<!-- poids inchange -->
<line x1="476" y1="206" x2="476" y2="262" stroke="#dc2626" stroke-width="3" marker-end="url(#vv-r)"/>
<text class="lb" x="484" y="252" fill="#dc2626" font-weight="700">poids</text>
<text class="lb" x="338" y="264" font-size="10.5">Une part soutient, l'autre fait tourner.</text>
<text class="lb" x="338" y="279" font-size="10.5">La part verte doit rester &#233;gale au poids : sinon l'avion descend.</text>

<!-- ============ BANDEAU ============ -->
<rect class="cad" x="16" y="302" width="608" height="62" rx="6"/>
<text class="lb" x="28" y="322">La <tspan class="aerolex-terme" data-slug="portance">portance</tspan> reste perpendiculaire aux ailes : en inclinant, elle penche avec l'avion.</text>
<text class="lb" x="28" y="340">Sa part verticale diminue alors que le <tspan class="aerolex-terme" data-slug="poids">poids</tspan> ne change pas &#8594; il faut <tspan class="aerolex-terme" data-slug="facteur-de-charge">plus de portance</tspan>.</text>
<text class="lb" x="28" y="358" font-size="10.5" fill="#64748b">D'o&#249; la r&#232;gle : en <tspan class="aerolex-terme" data-slug="virage">virage</tspan>, on tire un peu et la <tspan class="aerolex-terme" data-slug="vitesse-de-decrochage">vitesse de d&#233;crochage</tspan> augmente.</text>
<text x="320" y="394" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">Plus l'<tspan class="aerolex-terme" data-slug="inclinaison">inclinaison</tspan> est forte, plus il faut de portance totale.</text>
</svg>
