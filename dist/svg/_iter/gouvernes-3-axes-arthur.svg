<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="tg" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tg">Les trois gouvernes : une vue par axe</title>
<defs>
<marker id="gg-a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
<marker id="gg-r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
</defs>
<rect width="640" height="420" fill="#e0f2fe" rx="8"/>
<text x="320" y="26" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">Les trois gouvernes primaires</text>
<text x="320" y="45" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Une gouverne par axe &#183; chaque axe dans la vue o&#249; il se voit</text>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2;rx:6}
.vt{font-family:Arial;font-size:11px;font-weight:700;fill:#475569}
.av{fill:#cbd5e1;stroke:#1e3a5f;stroke-width:1.6}
.mo{fill:#f59e0b;stroke:#b45309;stroke-width:1.4}
.lb{font-family:Arial;font-size:11.5px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12px;font-weight:700;fill:#1e3a5f;cursor:pointer}
.ax{font-family:Arial;font-size:11px;fill:#dc2626;font-weight:700}
</style>

<!-- ================= VUE 1 : DE DESSUS -> LACET ================= -->
<rect class="cad" x="16" y="60" width="196" height="200"/>
<text class="vt" x="24" y="76">VUE DE DESSUS</text>
<!-- fuselage vertical, NEZ EN HAUT -->
<path class="av" d="M108 92 L116 112 L116 208 L100 208 L100 112 Z"/>
<text class="lb" x="120" y="100" fill="#16a34a" font-weight="700">nez</text>
<!-- aile horizontale -->
<rect class="av" x="46" y="140" width="124" height="16"/>
<!-- empennage horizontal arriere -->
<rect class="av" x="82" y="196" width="52" height="11"/>
<!-- derive (vue de dessus = trait central) + gouverne de direction mobile -->
<path class="mo" d="M104 208 L112 208 L112 232 L104 232 Z"/>
<line x1="108" y1="236" x2="150" y2="236" stroke="#dc2626" stroke-width="2" marker-end="url(#gg-r)"/>
<text class="ax" x="120" y="252">LACET</text>
<text class="aerolex-terme" data-slug="gouverne-de-direction" x="24" y="278">gouverne de direction</text>
<text class="lb" x="24" y="294">command&#233;e au <tspan class="aerolex-terme" data-slug="palonnier">palonnier</tspan></text>

<!-- ================= VUE 2 : DE COTE -> TANGAGE ================= -->
<rect class="cad" x="222" y="60" width="196" height="200"/>
<text class="vt" x="230" y="76">VUE DE COTE</text>
<!-- fuselage horizontal, NEZ A DROITE -->
<path class="av" d="M244 150 L360 142 Q392 146 402 152 Q392 158 360 160 L244 154 Z"/>
<text class="lb" x="376" y="134" fill="#16a34a" font-weight="700">nez</text>
<!-- aile haute (Aquila) vue de cote -->
<rect class="av" x="300" y="132" width="56" height="7"/>
<!-- derive verticale arriere -->
<path class="av" d="M244 150 L236 112 L256 112 L262 150 Z"/>
<!-- empennage horizontal + gouverne de profondeur mobile -->
<rect class="av" x="240" y="148" width="34" height="7"/>
<path class="mo" d="M226 148 L240 148 L240 155 L226 155 Z"/>
<line x1="222" y1="168" x2="222" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#gg-r)"/>
<text class="ax" x="230" y="196">TANGAGE</text>
<text class="aerolex-terme" data-slug="gouverne-de-profondeur" x="230" y="278">gouverne de profondeur</text>
<text class="lb" x="230" y="294">manche tir&#233; / pouss&#233;</text>

<!-- ================= VUE 3 : DE FACE -> ROULIS ================= -->
<rect class="cad" x="428" y="60" width="196" height="200"/>
<text class="vt" x="436" y="76">VUE DE FACE</text>
<!-- fuselage vu de face = petit cercle central -->
<path class="av" d="M524 132 L524 92 L528 92 L528 132 Z" stroke-width="1.2"/>
<rect class="av" x="512" y="128" width="28" height="4" stroke-width="1.2"/>
<circle class="av" cx="526" cy="156" r="15"/>
<text class="lb" x="538" y="106" font-size="10.5" fill="#1e3a5f">d&#233;rive</text>
<!-- aile haute pleine largeur -->
<rect class="av" x="448" y="132" width="156" height="10"/>
<!-- ailerons aux DEUX bouts, mobiles, sens opposes -->
<path class="mo" d="M448 132 L478 132 L478 142 L448 142 Z"/>
<path class="mo" d="M574 132 L604 132 L604 142 L574 142 Z"/>
<line x1="463" y1="126" x2="463" y2="104" stroke="#dc2626" stroke-width="2" marker-end="url(#gg-r)"/>
<line x1="589" y1="148" x2="589" y2="172" stroke="#dc2626" stroke-width="2" marker-end="url(#gg-r)"/>
<text class="ax" x="492" y="196">ROULIS</text>
<text class="lb" x="436" y="212" font-size="10.5">un aileron monte, l'autre descend</text>
<text class="lb" x="436" y="228" font-size="10.5" fill="#64748b">la <tspan class="aerolex-terme" data-slug="derive">d&#233;rive</tspan> pointe en haut : rep&#232;re s&#251;r</text>
<text class="aerolex-terme" data-slug="aileron" x="436" y="278">aileron</text>
<text class="lb" x="436" y="294">manche &#224; gauche / &#224; droite</text>

<!-- ================= BANDEAU BAS ================= -->
<rect class="cad" x="16" y="304" width="608" height="60"/>
<text class="lb" x="28" y="322" font-weight="700" fill="#1e3a5f">En jaune : les surfaces mobiles.</text>
<text class="lb" x="220" y="322">Une <tspan class="aerolex-terme" data-slug="gouverne">gouverne</tspan> = une surface qui bouge et fait tourner l'avion autour d'un axe.</text>
<text class="lb" x="28" y="342">L'ensemble derive + empennage arriere forme l'<tspan class="aerolex-terme" data-slug="empennage">empennage</tspan>.</text>
<text class="lb" x="28" y="358" font-size="10.5" fill="#64748b">En <tspan class="aerolex-terme" data-slug="double-commande">double commande</tspan>, l'instructeur dispose des memes commandes.</text>
<text x="320" y="392" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">Trois vues distinctes : ne jamais chercher le roulis sur la vue de dessus &#8212; il ne s'y voit pas.</text>
</svg>
