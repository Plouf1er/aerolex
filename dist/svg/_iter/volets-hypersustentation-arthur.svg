<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tvo" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tvo">Les volets : plus de portance, plus de train&#233;e</title>
<defs><marker id="vo-b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
<marker id="vo-o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker></defs>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="26" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">Les volets : voler moins vite sans d&#233;crocher</text>
<text x="320" y="45" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Coupe de l'aile vue de c&#244;t&#233; &#183; le vent arrive de la gauche</text>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.vt{font-family:Arial;font-size:11px;font-weight:700;fill:#475569}
.pr{fill:#dbe6f0;stroke:#1e3a5f;stroke-width:2}
.mo{fill:#f59e0b;stroke:#b45309;stroke-width:2}
.lb{font-family:Arial;font-size:11.5px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12px;font-weight:700;cursor:pointer;fill:#1e3a5f}
</style>
<rect class="cad" x="16" y="58" width="296" height="200" rx="6"/>
<text class="vt" x="26" y="76">VOLETS RENTR&#201;S</text>
<path class="pr" d="M60 168 Q140 132 250 148 Q150 164 60 168 Z"/>
<line x1="26" y1="168" x2="54" y2="168" stroke="#16a34a" stroke-width="3"/>
<text class="lb" x="26" y="188" font-size="10" fill="#16a34a">vent</text>
<line x1="150" y1="130" x2="150" y2="96" stroke="#2563eb" stroke-width="3" marker-end="url(#vo-b)"/>
<text class="lb" x="158" y="104" fill="#2563eb">portance normale</text>
<text class="lb" x="26" y="222" font-size="10.5">Profil lisse : peu de tra&#238;n&#233;e, il faut voler vite.</text>
<text class="lb" x="26" y="242" font-size="10.5" fill="#64748b">Configuration croisi&#232;re.</text>

<rect class="cad" x="328" y="58" width="296" height="200" rx="6"/>
<text class="vt" x="338" y="76">VOLETS SORTIS</text>
<path class="pr" d="M372 168 Q452 132 542 146 Q460 162 372 168 Z"/>
<path class="mo" d="M542 146 Q566 152 582 176 L570 182 Q556 160 538 158 Z"/>
<line x1="338" y1="168" x2="366" y2="168" stroke="#16a34a" stroke-width="3"/>
<text class="lb" x="338" y="188" font-size="10" fill="#16a34a">vent</text>
<line x1="460" y1="130" x2="460" y2="86" stroke="#2563eb" stroke-width="4" marker-end="url(#vo-b)"/>
<text class="lb" x="468" y="94" fill="#2563eb">portance AUGMENT&#201;E</text>
<line x1="560" y1="196" x2="608" y2="196" stroke="#b45309" stroke-width="3.4" marker-end="url(#vo-o)"/>
<text class="lb" x="516" y="214" font-size="10.5" fill="#b45309">tra&#238;n&#233;e en plus &#8594;</text>
<text class="lb" x="338" y="234" font-size="10.5">L'aile devient plus courbe : elle porte encore &#224; vitesse r&#233;duite.</text>
<text class="aerolex-terme" data-slug="volet" x="586" y="140" fill="#b45309">volet</text>

<rect class="cad" x="16" y="268" width="608" height="88" rx="6"/>
<text class="lb" x="28" y="288" font-weight="700">Sortir les <tspan class="aerolex-terme" data-slug="volet">volets</tspan> augmente la <tspan class="aerolex-terme" data-slug="portance">portance</tspan> ET la <tspan class="aerolex-terme" data-slug="trainee">tra&#238;n&#233;e</tspan>.</text>
<text class="lb" x="28" y="308">Cons&#233;quence utile : la <tspan class="aerolex-terme" data-slug="vitesse-de-decrochage">vitesse de d&#233;crochage</tspan> baisse &#8594; on peut approcher plus lentement.</text>
<text class="lb" x="28" y="326" font-size="10.5" fill="#64748b">Cons&#233;quence g&#234;nante : plus de tra&#238;n&#233;e &#8594; pente d'approche plus forte, moins de finesse.</text>
<text class="lb" x="28" y="344" font-size="10.5" fill="#64748b">C'est l'<tspan class="aerolex-terme" data-slug="hypersustentation" font-size="10.5">hypersustentation</tspan> : on choisit de porter plus, en acceptant de freiner.</text>
<text x="320" y="384" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">Volets = atterrir plus lentement et plus court, en descendant plus raide.</text>
</svg>
