<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="tr" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tr">Les trois axes de l'avion</title>
<defs><marker id="rr-r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker></defs>
<rect width="640" height="420" fill="#e0f2fe" rx="8"/>
<text x="320" y="26" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">Les trois axes de l'avion</text>
<text x="320" y="45" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Trois axes fixes, qui passent tous par le centre de gravit&#233;</text>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.vt{font-family:Arial;font-size:11px;font-weight:700;fill:#475569}
.av{fill:#cbd5e1;stroke:#1e3a5f;stroke-width:1.6}
.lb{font-family:Arial;font-size:11.5px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12px;font-weight:700;fill:#1e3a5f;cursor:pointer}
.ax{font-family:Arial;font-size:11px;fill:#dc2626;font-weight:700}
.axl{stroke:#dc2626;stroke-width:2;stroke-dasharray:7 4}
</style>

<!-- VUE DE DESSUS : axe de LACET (vertical, perpendiculaire a la feuille) -->
<rect class="cad" x="16" y="60" width="196" height="200" rx="6"/>
<text class="vt" x="24" y="76">VUE DE DESSUS</text>
<path class="av" d="M108 92 L116 112 L116 208 L100 208 L100 112 Z"/>
<text class="lb" x="120" y="102" fill="#16a34a" font-weight="700">nez</text>
<rect class="av" x="46" y="140" width="124" height="16"/>
<rect class="av" x="82" y="196" width="52" height="11"/>
<circle cx="108" cy="148" r="9" fill="none" stroke="#dc2626" stroke-width="2"/>
<circle cx="108" cy="148" r="2.5" fill="#dc2626"/>
<text class="ax" x="122" y="140">axe de lacet</text>
<text class="lb" x="24" y="230" font-size="10.5">l'axe sort de la feuille (vu par le bout)</text>
<text class="aerolex-terme" data-slug="axe-de-lacet" x="24" y="252">axe de lacet</text>
<text class="lb" x="24" y="268" font-size="10.5">le nez part &#224; gauche/droite</text>

<!-- VUE DE COTE : axe de TANGAGE (transversal, vu par le bout) -->
<rect class="cad" x="222" y="60" width="196" height="200" rx="6"/>
<text class="vt" x="230" y="76">VUE DE COTE</text>
<path class="av" d="M244 150 L360 142 Q392 146 402 152 Q392 158 360 160 L244 154 Z"/>
<text class="lb" x="372" y="134" fill="#16a34a" font-weight="700">nez</text>
<rect class="av" x="300" y="132" width="56" height="7"/>
<path class="av" d="M244 150 L236 112 L256 112 L262 150 Z"/>
<rect class="av" x="240" y="148" width="34" height="7"/>
<circle cx="318" cy="150" r="9" fill="none" stroke="#dc2626" stroke-width="2"/>
<circle cx="318" cy="150" r="2.5" fill="#dc2626"/>
<text class="ax" x="252" y="186">axe de tangage</text>
<text class="lb" x="230" y="230" font-size="10.5">l'axe traverse les deux ailes</text>
<text class="aerolex-terme" data-slug="axe-de-tangage" x="230" y="252">axe de tangage</text>
<text class="lb" x="230" y="268" font-size="10.5">le nez monte / descend</text>

<!-- VUE DE FACE : axe de ROULIS (longitudinal, vu par le bout) -->
<rect class="cad" x="428" y="60" width="196" height="200" rx="6"/>
<text class="vt" x="436" y="76">VUE DE FACE</text>
<path class="av" d="M524 132 L524 92 L528 92 L528 132 Z" stroke-width="1.2"/>
<rect class="av" x="512" y="128" width="28" height="4" stroke-width="1.2"/>
<text class="lb" x="538" y="106" font-size="10.5">d&#233;rive</text>
<rect class="av" x="448" y="132" width="156" height="10"/>
<circle class="av" cx="526" cy="156" r="15"/>
<circle cx="526" cy="156" r="9" fill="none" stroke="#dc2626" stroke-width="2"/>
<circle cx="526" cy="156" r="2.5" fill="#dc2626"/>
<text class="ax" x="436" y="196">axe de roulis</text>
<text class="lb" x="436" y="212" font-size="10.5">l'axe va du nez &#224; la queue</text>
<text class="aerolex-terme" data-slug="axe-de-roulis" x="436" y="252">axe de roulis</text>
<text class="lb" x="436" y="268" font-size="10.5">une aile monte, l'autre descend</text>

<rect class="cad" x="16" y="304" width="608" height="58" rx="6"/>
<text class="lb" x="28" y="324" font-weight="700">Le rond rouge = l'axe vu par le bout (il sort de la feuille).</text>
<text class="lb" x="28" y="342">Les trois axes se croisent au <tspan class="aerolex-terme" data-slug="centre-de-gravite">centre de gravit&#233;</tspan> : l'avion tourne toujours autour de ce point.</text>
<text class="lb" x="28" y="358" font-size="10.5" fill="#64748b">Les axes sont li&#233;s &#224; l'avion : ils basculent avec lui, pas avec l'horizon.</text>
<text x="320" y="392" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">Un axe = une droite fixe. Une <tspan class="aerolex-terme" data-slug="gouverne">gouverne</tspan> fait tourner l'avion AUTOUR de cette droite.</text>
</svg>
