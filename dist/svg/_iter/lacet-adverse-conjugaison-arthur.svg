<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tl" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tl">Lacet adverse et conjugaison</title>
<defs>
<marker id="ll-r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
<marker id="ll-g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
<marker id="ll-o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
</defs>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="26" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">Lacet adverse : l'avion part du mauvais c&#244;t&#233;</text>
<text x="320" y="45" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Vu de dessus, nez vers le haut &#183; virage &#224; droite demand&#233;</text>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.vt{font-family:Arial;font-size:11px;font-weight:700;fill:#475569}
.av{fill:#cbd5e1;stroke:#1e3a5f;stroke-width:1.5}
.mo{fill:#f59e0b;stroke:#b45309;stroke-width:1.3}
.lb{font-family:Arial;font-size:11.5px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12px;font-weight:700;cursor:pointer;fill:#1e3a5f}
</style>

<!-- CADRE 1 : ailerons seuls -> lacet adverse -->
<rect class="cad" x="16" y="58" width="296" height="230" rx="6"/>
<text class="vt" x="26" y="76">AILERONS SEULS</text>
<path class="av" d="M160 96 L168 118 L168 214 L152 214 L152 118 Z"/>
<text class="lb" x="172" y="106" fill="#16a34a" font-weight="700" font-size="10.5">nez</text>
<rect class="av" x="92" y="144" width="136" height="15"/>
<rect class="av" x="134" y="202" width="52" height="10"/>
<path class="av" d="M156 214 L164 214 L164 236 L156 236 Z"/>
<!-- aileron gauche BAISSE (aile monte) / droit LEVE -->
<rect class="mo" x="92" y="144" width="34" height="15"/>
<rect class="mo" x="194" y="144" width="34" height="15"/>
<text class="lb" x="26" y="136" font-size="10">aileron baiss&#233;</text>
<text class="lb" x="230" y="136" font-size="10">lev&#233;</text>
<!-- trainee plus forte cote aileron baisse -> nez part a GAUCHE -->
<line x1="100" y1="172" x2="100" y2="196" stroke="#b45309" stroke-width="3" marker-end="url(#ll-o)"/>
<text class="lb" x="26" y="212" font-size="10" fill="#b45309">plus de tra&#238;n&#233;e</text>
<path d="M160 92 A 60 60 0 0 0 116 108" fill="none" stroke="#dc2626" stroke-width="2.6" marker-end="url(#ll-r)"/>
<text class="lb" x="26" y="96" fill="#dc2626" font-weight="700">le nez part &#224; GAUCHE</text>
<text class="lb" x="26" y="256" font-size="10.5">On veut aller &#224; droite&#8230; le nez d&#233;rape &#224; gauche.</text>
<text class="aerolex-terme" data-slug="lacet-adverse" x="26" y="276" fill="#dc2626">lacet adverse</text>

<!-- CADRE 2 : ailerons + palonnier -> conjugaison -->
<rect class="cad" x="328" y="58" width="296" height="230" rx="6"/>
<text class="vt" x="338" y="76">AILERONS + PALONNIER</text>
<path class="av" d="M472 96 L480 118 L480 214 L464 214 L464 118 Z"/>
<text class="lb" x="484" y="106" fill="#16a34a" font-weight="700" font-size="10.5">nez</text>
<rect class="av" x="404" y="144" width="136" height="15"/>
<rect class="av" x="446" y="202" width="52" height="10"/>
<!-- gouverne de direction braquee a DROITE -->
<path class="mo" d="M468 214 L476 214 L484 236 L476 236 Z"/>
<rect class="mo" x="404" y="144" width="34" height="15"/>
<rect class="mo" x="506" y="144" width="34" height="15"/>
<text class="lb" x="488" y="248" font-size="10" fill="#b45309">pied droit</text>
<!-- le nez va bien a DROITE -->
<path d="M472 92 A 60 60 0 0 1 516 108" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#ll-g)"/>
<text class="lb" x="470" y="96" fill="#16a34a" font-weight="700">nez &#224; DROITE</text>
<text class="lb" x="338" y="256" font-size="10.5">Le palonnier annule le d&#233;rapage : le virage est propre.</text>
<text class="aerolex-terme" data-slug="conjugaison" x="338" y="276" fill="#16a34a">conjugaison</text>

<rect class="cad" x="16" y="298" width="608" height="58" rx="6"/>
<text class="lb" x="28" y="318">L'aileron baiss&#233; tra&#238;ne plus que l'autre : ce d&#233;s&#233;quilibre tire le nez du mauvais c&#244;t&#233;.</text>
<text class="lb" x="28" y="336">Rem&#232;de : un peu de <tspan class="aerolex-terme" data-slug="palonnier">palonnier</tspan> du m&#234;me c&#244;t&#233; que le virage &#8212; c'est la <tspan class="aerolex-terme" data-slug="conjugaison">conjugaison</tspan>.</text>
<text class="lb" x="28" y="352" font-size="10.5" fill="#64748b">Contr&#244;le : la <tspan class="aerolex-terme" data-slug="bille" font-size="10.5">bille</tspan> reste centr&#233;e. Si elle sort, le vol est en <tspan class="aerolex-terme" data-slug="derapage" font-size="10.5">d&#233;rapage</tspan>.</text>
<text x="320" y="384" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">Ailerons pour incliner, palonnier pour garder le nez dans l'axe du virage.</text>
</svg>
