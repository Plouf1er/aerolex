<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" role="img" aria-labelledby="t">
<title id="t">Les forces dans un virage stabilisé</title>
<style>
.pl{fill:#dfe8f0;stroke:#1b3a5c;stroke-width:2}
.f{stroke:#c1462c;stroke-width:3.2;fill:none;marker-end:url(#a)}
.comp{stroke:#2d7d5a;stroke-width:2.4;fill:none;marker-end:url(#g)}
.gl{stroke:#5a6b7a;stroke-width:1.3;stroke-dasharray:6 4}
text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#1b3a5c}
.aerolex-terme{font-weight:bold;cursor:pointer}
.sub{font-size:12.5px;fill:#5a6b7a;font-weight:normal}
.ang{font-size:14px;fill:#c1462c;font-weight:bold}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c1462c"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2d7d5a"/></marker>
</defs>
<g transform="rotate(30 300 230)">
<path class="pl" d="M180 230 h240 l30 -7 v14 l-30 -7"/>
<path class="pl" d="M300 230 l0 -80 h0 z"/>
<path class="pl" d="M212 230 l88 -12 v24 z"/>
<path class="pl" d="M300 218 h96 v24 h-96 z" fill="#dfe8f0"/>
</g>
<line class="gl" x1="120" y1="230" x2="540" y2="230"/>
<text class="sub" x="470" y="250">horizon</text>
<line class="f" x1="300" y1="216" x2="230" y2="76"/>
<text class="aerolex-terme" data-slug="portance" x="150" y="66">portance inclinée</text>
<line class="comp" x1="300" y1="216" x2="300" y2="86"/>
<text class="sub" x="308" y="92">composante verticale</text>
<text class="sub" x="308" y="110">= tient l'altitude</text>
<line class="comp" x1="300" y1="216" x2="182" y2="216"/>
<text class="sub" x="120" y="206">composante</text>
<text class="sub" x="120" y="190">horizontale</text>
<text class="ang" x="286" y="150">φ</text>
<text class="aerolex-terme" data-slug="inclinaison" x="330" y="176">inclinaison</text>
<line class="f" x1="300" y1="244" x2="300" y2="360"/>
<text class="aerolex-terme" data-slug="virage" x="330" y="352">virage</text>
<text class="aerolex-terme" data-slug="virage-horizontal-stabilise" x="330" y="330">virage horizontal stabilisé</text>
<text class="aerolex-terme" data-slug="rayon" x="60" y="398">rayon</text>
<text class="sub" x="112" y="398">— diminue quand l'inclinaison augmente</text>
<text class="aerolex-terme" data-slug="virage-a-grande-inclinaison" x="60" y="422">virage à grande inclinaison</text>
<text class="sub" x="292" y="422">— portance totale à augmenter</text>
</svg>
