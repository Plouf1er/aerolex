<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tp" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tp">G&#233;om&#233;trie du profil d'aile</title>
<defs>
<marker id="pg-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
</defs>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.vt{font-family:Arial;font-size:10.5px;font-weight:700;fill:#475569}
.lb{font-family:Arial;font-size:12px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12.5px;font-weight:700;cursor:pointer}
</style>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="20" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">G&#233;om&#233;trie du profil d'aile</text>
<text x="320" y="38" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Les mots exacts pour d&#233;crire une coupe d'aile</text>

<rect class="cad" x="16" y="50" width="608" height="254" rx="6"/>
<text class="vt" x="28" y="68">COUPE DU PROFIL &#183; VENT DE GAUCHE &#183; BA ARRONDI &#192; GAUCHE &#183; BF EFFIL&#201; &#192; DROITE</text>

<!-- Profil clair -->
<path d="M100 200
  C105 155, 150 120, 230 118
  C310 116, 400 140, 480 175
  C505 190, 520 198, 528 202
  C520 206, 505 214, 480 220
  C400 235, 310 232, 230 226
  C150 220, 108 215, 100 200 Z"
  fill="#dbe4ee" stroke="#1e3a5f" stroke-width="2.2"/>

<!-- CORDE en pointill&#233;s, labels HORS de la ligne -->
<line x1="100" y1="200" x2="528" y2="202" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="7 4"/>
<circle cx="100" cy="200" r="3.5" fill="#7c3aed"/>
<circle cx="528" cy="202" r="3.5" fill="#7c3aed"/>
<!-- label corde SOUS le profil, pas sur la ligne -->
<text class="aerolex-terme" data-slug="corde" x="280" y="255" fill="#7c3aed" font-size="13">corde</text>
<text class="lb" x="320" y="255" font-size="10.5" fill="#7c3aed">= ligne BA &#8594; BF</text>
<!-- petite fl&#232;che de la corde vers le label -->
<line x1="310" y1="210" x2="310" y2="240" stroke="#7c3aed" stroke-width="1" stroke-dasharray="2 2"/>

<!-- BA : juste un trait vertical de rep&#232;re + label, PAS de gros crochet -->
<line x1="100" y1="175" x2="100" y2="225" stroke="#16a34a" stroke-width="2.5"/>
<text class="aerolex-terme" data-slug="bord-d-attaque" x="28" y="160" fill="#16a34a">bord d'attaque</text>
<text class="lb" x="40" y="175" font-size="10.5" fill="#16a34a">arrondi</text>

<!-- BF label seulement -->
<text class="aerolex-terme" data-slug="bord-de-fuite" x="535" y="188" fill="#ea580c">bord de fuite</text>
<text class="lb" x="545" y="203" font-size="10.5" fill="#ea580c">effil&#233;</text>

<!-- EXTRADOS au-dessus -->
<text class="aerolex-terme" data-slug="extrados" x="250" y="100" fill="#2563eb">extrados</text>
<text class="lb" x="245" y="114" font-size="10.5" fill="#2563eb">face sup&#233;rieure</text>
<line x1="290" y1="118" x2="290" y2="130" stroke="#2563eb" stroke-width="1.5"/>

<!-- INTRADOS sous profil, &#224; gauche pour ne pas croiser corde label -->
<text class="aerolex-terme" data-slug="intrados" x="150" y="270" fill="#0891b2">intrados</text>
<text class="lb" x="145" y="284" font-size="10.5" fill="#0891b2">face inf&#233;rieure</text>
<line x1="200" y1="230" x2="200" y2="255" stroke="#0891b2" stroke-width="1.5"/>

<!-- &#201;PAISSEUR max ~x=240, extrados y~118 &#224; intrados y~228 -->
<line x1="240" y1="118" x2="240" y2="228" stroke="#dc2626" stroke-width="2.5"/>
<line x1="233" y1="118" x2="247" y2="118" stroke="#dc2626" stroke-width="2.5"/>
<line x1="233" y1="228" x2="247" y2="228" stroke="#dc2626" stroke-width="2.5"/>
<!-- label &#233;paisseur &#224; DROITE de la barre, DANS le profil -->
<text class="aerolex-terme" data-slug="epaisseur" x="252" y="170" fill="#dc2626">&#233;paisseur</text>
<text class="lb" x="252" y="184" font-size="9.5" fill="#dc2626">extrados &#8596; intrados</text>

<!-- Vent relatif vers BA -->
<line x1="30" y1="200" x2="78" y2="200" stroke="#16a34a" stroke-width="2.5" marker-end="url(#pg-g)"/>
<text class="aerolex-terme" data-slug="vent-relatif" x="28" y="220" fill="#16a34a" font-size="10.5">vent relatif</text>

<!-- BANDEAU -->
<rect class="cad" x="16" y="314" width="608" height="70" rx="6"/>
<text class="lb" x="28" y="336" font-weight="700">Le profil = coupe de l'aile dans le sens de l'avancement.</text>
<text class="lb" x="28" y="354" font-size="11.5"><tspan class="aerolex-terme" data-slug="bord-d-attaque">BA</tspan> arrondi (re&#231;oit l'air) &#183; <tspan class="aerolex-terme" data-slug="bord-de-fuite">BF</tspan> effil&#233; &#183; <tspan class="aerolex-terme" data-slug="corde">corde</tspan> = r&#233;f&#233;rence pour l'<tspan class="aerolex-terme" data-slug="incidence">incidence</tspan>.</text>
<text class="lb" x="28" y="372" font-size="10.5" fill="#64748b">&#201;paisseur = distance entre extrados et intrados (pas jusqu'&#224; la corde).</text>
</svg>
