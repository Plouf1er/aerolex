<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tf" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tf">Les quatre forces en vol en palier</title>
<defs>
<marker id="fp-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="fp-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
<marker id="fp-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
<marker id="fp-o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b45309"/></marker>
</defs>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.vt{font-family:Arial;font-size:11px;font-weight:700;fill:#475569}
.av{fill:#cbd5e1;stroke:#1e3a5f;stroke-width:1.4}
.lb{font-family:Arial;font-size:12px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12.5px;font-weight:700;cursor:pointer}
</style>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="24" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">Les quatre forces en vol en palier</text>
<text x="320" y="42" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Vitesse et altitude constantes : &#233;quilibre deux &#224; deux</text>

<rect class="cad" x="16" y="54" width="608" height="236" rx="6"/>
<text class="vt" x="26" y="72">VUE DE C&#212;T&#201; &#183; NEZ &#192; DROITE</text>

<!--
  CG = (320, 178)
  Longueur STRICTE shaft = 90 px pour les 4 (m&#234;me marker)
  Portance: (320,178)->(320,88)
  Poids:    (320,178)->(320,268)
  Traction: (320,178)->(410,178)
  Trainee:  (320,178)->(230,178)
-->

<!-- Avion en fond, translucide sous les fleches -->
<path class="av" d="M255 172 L355 166 Q385 170 395 178 Q385 186 355 190 L255 184 Z" opacity="0.55"/>
<rect class="av" x="295" y="154" width="60" height="8" rx="1" opacity="0.55"/>
<path class="av" d="M255 172 L246 138 L262 138 L270 172 Z" opacity="0.55"/>
<rect class="av" x="252" y="172" width="24" height="5" opacity="0.55"/>
<circle cx="395" cy="178" r="3.5" fill="#64748b" opacity="0.7"/>

<!-- Axes guides -->
<line x1="140" y1="178" x2="500" y2="178" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4 4"/>
<line x1="320" y1="80" x2="320" y2="276" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4 4"/>

<!-- CG -->
<circle cx="320" cy="178" r="5.5" fill="#dc2626"/>
<circle cx="320" cy="178" r="2.2" fill="#f8fafc"/>

<!-- PORTANCE haut 90px -->
<line x1="320" y1="178" x2="320" y2="88" stroke="#2563eb" stroke-width="3.6" marker-end="url(#fp-b)"/>
<text class="aerolex-terme" data-slug="portance" x="334" y="100" fill="#2563eb">portance</text>

<!-- POIDS bas 90px -->
<line x1="320" y1="178" x2="320" y2="268" stroke="#dc2626" stroke-width="3.6" marker-end="url(#fp-r)"/>
<text class="aerolex-terme" data-slug="poids" x="334" y="258" fill="#dc2626">poids</text>
<text class="lb" x="248" y="198" font-size="10" fill="#64748b"><tspan class="aerolex-terme" data-slug="centre-de-gravite" font-size="10">centre de gravit&#233;</tspan></text>

<!-- TRACTION droite 90px &#8212; label AU-DESSUS hors fleche -->
<line x1="320" y1="178" x2="410" y2="178" stroke="#16a34a" stroke-width="3.6" marker-end="url(#fp-g)"/>
<text class="aerolex-terme" data-slug="traction" x="348" y="160" fill="#16a34a">traction</text>
<text class="lb" x="418" y="174" font-size="10.5" fill="#64748b">h&#233;lice &#8594;</text>

<!-- TRAINEE gauche 90px &#8212; label AU-DESSOUS pour ne pas chevaucher empennage -->
<line x1="320" y1="178" x2="230" y2="178" stroke="#b45309" stroke-width="3.6" marker-end="url(#fp-o)"/>
<text class="aerolex-terme" data-slug="trainee" x="248" y="212" fill="#b45309">tra&#238;n&#233;e</text>
<text class="lb" x="148" y="182" font-size="10.5" fill="#64748b">&#8592; air freine</text>

<!-- Bandeau -->
<rect class="cad" x="16" y="300" width="608" height="72" rx="6"/>
<text class="lb" x="28" y="322" font-weight="700">En vol en palier stabilis&#233; : <tspan class="aerolex-terme" data-slug="portance">portance</tspan> = <tspan class="aerolex-terme" data-slug="poids">poids</tspan> &#160;et&#160; <tspan class="aerolex-terme" data-slug="traction">traction</tspan> = <tspan class="aerolex-terme" data-slug="trainee">tra&#238;n&#233;e</tspan>.</text>
<text class="lb" x="28" y="342" font-size="11.5">Les quatre fl&#232;ches partent du m&#234;me point et ont la m&#234;me longueur : c'est l'&#233;quilibre.</text>
<text class="lb" x="28" y="360" font-size="10.5" fill="#64748b">Si traction > tra&#238;n&#233;e &#8594; l'avion acc&#233;l&#232;re. Si portance > poids &#8594; il monte.</text>
<text x="320" y="390" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">Deux couples : vertical (porter) et horizontal (avancer).</text>
</svg>
