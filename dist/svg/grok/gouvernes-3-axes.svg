<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tg" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tg">Les trois gouvernes et les trois axes</title>
<defs>
<marker id="g3-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
</defs>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.vt{font-family:Arial;font-size:10px;font-weight:700;fill:#475569}
.av{fill:#cbd5e1;stroke:#1e3a5f;stroke-width:1.5}
.mo{fill:#f59e0b;stroke:#b45309;stroke-width:1.3}
.lb{font-family:Arial;font-size:11px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:11.5px;font-weight:700;cursor:pointer}
.ax{font-family:Arial;font-size:13px;fill:#dc2626;font-weight:700}
</style>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="20" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">Les trois gouvernes primaires</text>
<text x="320" y="36" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#64748b">Jaune = surface mobile &#183; une gouverne par axe</text>

<!-- 1 LACET -->
<rect class="cad" x="12" y="46" width="200" height="254" rx="6"/>
<text class="vt" x="22" y="62">VUE DE DESSUS &#183; NEZ EN HAUT</text>
<path class="av" d="M104 78 L116 105 L116 195 L92 195 L92 105 Z"/>
<rect class="av" x="40" y="128" width="132" height="12" rx="1"/>
<rect class="av" x="76" y="182" width="60" height="9"/>
<!-- gouverne direction -->
<path class="mo" d="M100 195 L112 195 L124 228 L108 228 Z"/>
<!-- arc hors aile -->
<path d="M128 88 A26 26 0 0 1 152 112" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#g3-r)"/>
<!-- label LACET sous l'avion, pas sur l'aile -->
<text class="ax" x="22" y="218">LACET</text>
<text class="aerolex-terme" data-slug="gouverne" x="22" y="248" fill="#b45309">gouverne de direction</text>
<text class="lb" x="22" y="266" font-size="10.5">axe = <tspan class="aerolex-terme" data-slug="lacet" font-size="10.5" fill="#dc2626">lacet</tspan> (vertical)</text>
<text class="lb" x="22" y="282" font-size="10.5">commande : <tspan class="aerolex-terme" data-slug="palonnier" font-size="10.5">palonnier</tspan></text>

<!-- 2 TANGAGE -->
<rect class="cad" x="220" y="46" width="200" height="254" rx="6"/>
<text class="vt" x="230" y="62">VUE DE C&#212;T&#201; &#183; NEZ &#192; DROITE</text>
<!-- fuselage -->
<path class="av" d="M255 148 L355 140 Q382 144 392 152 Q382 160 355 164 L255 156 Z"/>
<!-- aile -->
<rect class="av" x="305" y="132" width="46" height="7" rx="1"/>
<!-- d&#233;rive -->
<path class="av" d="M255 148 L248 108 L264 108 L272 148 Z"/>
<!-- plan fixe horizontal ATTACH&#201; -->
<rect class="av" x="255" y="150" width="28" height="6"/>
<!-- gouverne profondeur RELEVEE (manche tire = cabre = nez monte) -->
<path class="mo" d="M255 150 L238 128 L248 128 L255 150 Z"/>
<circle cx="255" cy="153" r="2.5" fill="#b45309"/>
<text class="lb" x="220" y="125" font-size="9" fill="#b45309">relevée</text>
<!-- arc tangage sous l'avion -->
<path d="M300 175 A18 18 0 0 1 300 205" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#g3-r)"/>
<text class="ax" x="230" y="218">TANGAGE</text>
<text class="lb" x="330" y="220" font-size="9.5" fill="#64748b">nez monte</text>
<text class="aerolex-terme" data-slug="gouverne" x="230" y="248" fill="#b45309">gouverne de profondeur</text>
<text class="lb" x="230" y="266" font-size="10.5">axe = <tspan class="aerolex-terme" data-slug="tangage" font-size="10.5" fill="#dc2626">tangage</tspan> (transversal)</text>
<text class="lb" x="230" y="282" font-size="10.5">commande : manche avant/arri&#232;re</text>

<!-- 3 ROULIS -->
<rect class="cad" x="428" y="46" width="200" height="254" rx="6"/>
<text class="vt" x="438" y="62">VUE DE FACE &#183; NEZ VERS NOUS</text>
<path class="av" d="M520 105 L524 70 L532 70 L536 105 Z"/>
<circle class="av" cx="528" cy="132" r="14"/>
<!-- aile -->
<rect class="av" x="450" y="116" width="156" height="10" rx="1"/>
<!-- aileron DROIT avion (gauche &#233;cran) BAISS&#201; &#8594; aile monte -->
<path class="mo" d="M450 126 L476 126 L476 142 L450 138 Z"/>
<!-- aileron GAUCHE avion (droite &#233;cran) LEV&#201; &#8594; aile descend -->
<path class="mo" d="M580 102 L606 105 L606 126 L580 126 Z"/>
<!-- fl&#232;ches EFFET -->
<line x1="463" y1="110" x2="463" y2="92" stroke="#dc2626" stroke-width="2.2" marker-end="url(#g3-r)"/>
<text class="lb" x="448" y="88" font-size="9" fill="#dc2626">monte</text>
<line x1="593" y1="145" x2="593" y2="165" stroke="#dc2626" stroke-width="2.2" marker-end="url(#g3-r)"/>
<text class="lb" x="568" y="178" font-size="9" fill="#dc2626">descend</text>
<!-- arc roulis bas -->
<path d="M498 150 A30 18 0 0 0 558 150" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#g3-r)"/>
<text class="ax" x="438" y="218">ROULIS</text>
<text class="aerolex-terme" data-slug="aileron" x="438" y="248" fill="#b45309">ailerons</text>
<text class="lb" x="438" y="266" font-size="10.5">axe = <tspan class="aerolex-terme" data-slug="roulis" font-size="10.5" fill="#dc2626">roulis</tspan> (longitudinal)</text>
<text class="lb" x="438" y="282" font-size="10.5">commande : manche lat&#233;ral</text>

<!-- BANDEAU -->
<rect class="cad" x="12" y="310" width="616" height="76" rx="6"/>
<text class="lb" x="24" y="332" font-weight="700">Jaune = ce qui bouge. Chaque <tspan class="aerolex-terme" data-slug="gouverne">gouverne</tspan> commande UN seul axe.</text>
<text class="lb" x="24" y="352" font-size="11"><tspan class="aerolex-terme" data-slug="aileron">Ailerons</tspan> &#8594; <tspan class="aerolex-terme" data-slug="roulis">roulis</tspan> &#160;&#183;&#160; profondeur &#8594; <tspan class="aerolex-terme" data-slug="tangage">tangage</tspan> &#160;&#183;&#160; direction &#8594; <tspan class="aerolex-terme" data-slug="lacet">lacet</tspan> (au <tspan class="aerolex-terme" data-slug="palonnier">palonnier</tspan>).</text>
<text class="lb" x="24" y="370" font-size="10.5" fill="#64748b">Aileron LEV&#201; = cette aile DESCEND &#183; aileron BAISS&#201; = cette aile MONTE.</text>
</svg>
