<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tv" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tv">En virage, la portance s'incline et se d&#233;compose</title>
<defs>
<marker id="vf-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="vf-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
<marker id="vf-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
<marker id="vf-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/></marker>
</defs>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.vt{font-family:Arial;font-size:10.5px;font-weight:700;fill:#475569}
.av{fill:#cbd5e1;stroke:#1e3a5f;stroke-width:1.3}
.lb{font-family:Arial;font-size:11px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:11.5px;font-weight:700;cursor:pointer}
.hz{stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 4}
</style>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="22" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e3a5f">En virage, la portance s'incline et se partage en deux</text>
<text x="320" y="40" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">M&#234;me avion vu de l'arri&#232;re (on le suit) : &#224; plat, puis inclin&#233; 30&#176; &#224; droite</text>

<!-- CADRE 1 : A PLAT -->
<!-- CG1=(158,172)  W=L=72 -->
<rect class="cad" x="12" y="50" width="304" height="244" rx="6"/>
<text class="vt" x="22" y="68">VU DE L'ARRI&#200;RE &#183; AILES &#192; PLAT</text>
<line class="hz" x1="28" y1="172" x2="300" y2="172"/>
<text class="lb" x="28" y="188" font-size="9.5" fill="#64748b">horizon</text>

<!-- Avion a plat, opacite reduite sous fleches -->
<path class="av" d="M152 148 L152 122 L164 122 L164 148 Z" opacity="0.7"/>
<rect class="av" x="144" y="146" width="28" height="5" opacity="0.7"/>
<rect class="av" x="94" y="160" width="128" height="9" opacity="0.7"/>
<circle class="av" cx="158" cy="172" r="12" opacity="0.7"/>

<!-- Portance = 72 vers le haut depuis CG -->
<line x1="158" y1="172" x2="158" y2="100" stroke="#2563eb" stroke-width="3.4" marker-end="url(#vf-b)"/>
<text class="aerolex-terme" data-slug="portance" x="170" y="108" fill="#2563eb">portance</text>
<text class="lb" x="170" y="122" font-size="10" fill="#64748b">L = poids</text>

<!-- Poids = 72 vers le bas depuis CG -->
<line x1="158" y1="172" x2="158" y2="244" stroke="#dc2626" stroke-width="3.4" marker-end="url(#vf-r)"/>
<text class="aerolex-terme" data-slug="poids" x="170" y="236" fill="#dc2626">poids</text>

<text class="lb" x="22" y="268" font-size="10.5">Toute la portance est verticale :</text>
<text class="lb" x="22" y="282" font-size="10.5">elle soutient 100 % du poids.</text>

<!-- CADRE 2 : VIRAGE 30 deg -->
<!--
  phi=30, W=72, L=W/cos30=83.14, Lh=L*sin30=41.57, Lv=72
  CG2=(478,172)
  L tip:  (478+41.57, 172-72) = (519.57, 100)
  Lv tip: (478, 100)
  Lh tip: (519.57, 172)
  W tip:  (478, 244)
-->
<rect class="cad" x="324" y="50" width="304" height="244" rx="6"/>
<text class="vt" x="334" y="68">VU DE L'ARRI&#200;RE &#183; INCLIN&#201; 30&#176; DROITE</text>
<line class="hz" x1="340" y1="172" x2="612" y2="172"/>
<text class="lb" x="340" y="188" font-size="9.5" fill="#64748b">horizon</text>

<!-- Avion incline -->
<g transform="rotate(30 478 172)" opacity="0.7">
<path class="av" d="M472 148 L472 122 L484 122 L484 148 Z"/>
<rect class="av" x="464" y="146" width="28" height="5"/>
<rect class="av" x="414" y="160" width="128" height="9"/>
<circle class="av" cx="478" cy="172" r="12"/>
</g>

<!-- Ligne d'aile etendue a 30 deg pour lire phi -->
<line x1="420" y1="138.5" x2="536" y2="205.5" stroke="#1e3a5f" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55"/>
<!-- Rectangle decomposition (gris) -->
<line x1="478" y1="172" x2="478" y2="100" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="478" y1="100" x2="519.6" y2="100" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="519.6" y1="100" x2="519.6" y2="172" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="478" y1="172" x2="519.6" y2="172" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>

<!-- TOUTES les forces partent du CG -->
<!-- Portance totale L (diagonale) -->
<line x1="478" y1="172" x2="519.6" y2="100" stroke="#2563eb" stroke-width="3.5" marker-end="url(#vf-b)"/>
<text class="aerolex-terme" data-slug="portance" x="526" y="96" fill="#2563eb">portance L</text>
<text class="lb" x="526" y="110" font-size="10" fill="#64748b">L > poids</text>

<!-- Lv verticale = 72 = poids, depuis CG -->
<line x1="478" y1="172" x2="478" y2="100" stroke="#16a34a" stroke-width="2.8" stroke-dasharray="5 3" marker-end="url(#vf-g)"/>
<text class="lb" x="400" y="120" fill="#16a34a" font-weight="700" font-size="10.5">Lv verticale</text>
<text class="lb" x="400" y="134" fill="#16a34a" font-size="10">= poids</text>

<!-- Lh horizontale depuis CG vers la droite -->
<line x1="478" y1="172" x2="519.6" y2="172" stroke="#7c3aed" stroke-width="2.8" stroke-dasharray="5 3" marker-end="url(#vf-p)"/>
<text class="lb" x="524" y="168" fill="#7c3aed" font-weight="700" font-size="10">Lh</text>
<text class="lb" x="524" y="180" fill="#7c3aed" font-size="9.5">tourne</text>

<!-- Angle phi -->
<path d="M512 172 A 34 34 0 0 0 507.4 155" fill="none" stroke="#b45309" stroke-width="2.2"/>
<text class="aerolex-terme" data-slug="inclinaison" x="520" y="148" fill="#b45309" font-size="10.5">&#966; = 30&#176;</text>

<!-- Poids = 72 depuis CG vers le bas -->
<line x1="478" y1="172" x2="478" y2="244" stroke="#dc2626" stroke-width="3.4" marker-end="url(#vf-r)"/>
<text class="aerolex-terme" data-slug="poids" x="490" y="236" fill="#dc2626">poids</text>

<!-- CG visible par-dessus -->
<circle cx="478" cy="172" r="4.5" fill="#1e3a5f"/>
<circle cx="478" cy="172" r="1.8" fill="#f8fafc"/>
<circle cx="158" cy="172" r="4.5" fill="#1e3a5f"/>
<circle cx="158" cy="172" r="1.8" fill="#f8fafc"/>

<text class="lb" x="334" y="268" font-size="10.5">Lv (vert) = poids &#8594; altitude tenue.</text>
<text class="lb" x="334" y="282" font-size="10.5">Lh (violet) tire vers le centre du virage.</text>

<!-- BANDEAU -->
<rect class="cad" x="12" y="304" width="616" height="68" rx="6"/>
<text class="lb" x="24" y="324" font-size="11.5">La <tspan class="aerolex-terme" data-slug="portance">portance</tspan> reste perpendiculaire aux ailes : en s'inclinant, elle penche avec l'avion.</text>
<text class="lb" x="24" y="342" font-size="11.5">Sa part verticale diminue (cos &#966;) alors que le <tspan class="aerolex-terme" data-slug="poids">poids</tspan> ne change pas &#8594; il faut augmenter L.</text>
<text class="lb" x="24" y="360" font-size="11">D'o&#249; le <tspan class="aerolex-terme" data-slug="facteur-de-charge">facteur de charge</tspan> n = 1/cos &#966; (&#224; 30&#176;, n &#8776; 1,15). La <tspan class="aerolex-terme" data-slug="vitesse-de-decrochage">vitesse de d&#233;crochage</tspan> monte en &#8730;n.</text>
<text x="320" y="390" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">Plus l'<tspan class="aerolex-terme" data-slug="inclinaison">inclinaison</tspan> est forte, plus il faut de portance pour un <tspan class="aerolex-terme" data-slug="virage">virage</tspan> en palier.</text>
</svg>
