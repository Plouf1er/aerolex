<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="ta" style="max-width:100%;width:100%;height:auto;display:block">
<title id="ta">A&#233;rofrein : d&#233;truire la portance pour descendre sans acc&#233;l&#233;rer</title>
<defs>
<marker id="af-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="af-o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b45309"/></marker>
<marker id="af-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
</defs>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.vt{font-family:Arial;font-size:10px;font-weight:700;fill:#475569}
.lb{font-family:Arial;font-size:11.5px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12px;font-weight:700;cursor:pointer}
.prof{fill:#cbd5e1;stroke:#1e3a5f;stroke-width:1.8}
.spo{fill:#dc2626;stroke:#991b1b;stroke-width:1.4}
.vol{fill:#f59e0b;stroke:#b45309;stroke-width:1.3}
</style>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="18" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">A&#233;rofrein &#8800; volet</text>
<text x="320" y="34" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#64748b">L'a&#233;rofrein d&#233;truit la portance et augmente la tra&#238;n&#233;e</text>

<!-- GAUCHE A&#201;ROFREIN -->
<rect class="cad" x="12" y="44" width="300" height="216" rx="6"/>
<text class="vt" x="22" y="60">A&#201;ROFREIN SORTI &#183; VUE DE C&#212;T&#201;</text>

<!-- Profil net BA arrondi G BF pointe D -->
<path class="prof" d="M55 155
  C55 140, 65 122, 92 116
  C125 108, 170 110, 210 125
  C230 134, 245 145, 252 152
  L249 156
  C230 162, 190 166, 150 164
  C110 162, 75 160, 62 158
  C57 157, 55 156, 55 155 Z"/>

<!-- spoiler inclin&#233; sur extrados, charni&#232;re claire -->
<path class="spo" d="M128 120 L150 82 L162 90 L142 128 Z"/>
<circle cx="135" cy="124" r="2.5" fill="#991b1b"/>
<text class="aerolex-terme" data-slug="aerofrein" x="168" y="78" fill="#dc2626" font-size="12">a&#233;rofrein</text>
<text class="lb" x="168" y="92" font-size="9.5" fill="#dc2626">sur <tspan class="aerolex-terme" data-slug="extrados" font-size="9.5" fill="#dc2626">extrados</tspan> &#8593;</text>

<!-- portance faible + croix, zone libre a droite -->
<line x1="215" y1="125" x2="215" y2="102" stroke="#2563eb" stroke-width="2" marker-end="url(#af-b)"/>
<line x1="205" y1="104" x2="225" y2="120" stroke="#dc2626" stroke-width="2"/>
<line x1="225" y1="104" x2="205" y2="120" stroke="#dc2626" stroke-width="2"/>
<text class="aerolex-terme" data-slug="portance" x="230" y="112" fill="#2563eb" font-size="10.5">portance &#8595;</text>

<!-- trainee vers arriere BF -->
<text class="aerolex-terme" data-slug="trainee" x="165" y="180" fill="#b45309" font-size="11">tra&#238;n&#233;e &#8593;&#8593;</text>
<line x1="155" y1="168" x2="245" y2="168" stroke="#b45309" stroke-width="3.2" marker-end="url(#af-o)"/>

<!-- descente -->
<line x1="245" y1="170" x2="245" y2="215" stroke="#dc2626" stroke-width="2.4" marker-end="url(#af-r)"/>
<text class="lb" x="252" y="195" font-size="10.5" fill="#dc2626" font-weight="700">descend</text>
<text class="lb" x="252" y="208" font-size="9.5" fill="#64748b">sans acc&#233;l&#233;rer</text>

<text class="lb" x="22" y="240" font-size="10.5" fill="#64748b">But : perdre de l'altitude SANS</text>
<text class="lb" x="22" y="254" font-size="10.5" fill="#64748b">prendre de la vitesse.</text>

<!-- DROITE VOLET -->
<rect class="cad" x="328" y="44" width="300" height="216" rx="6"/>
<text class="vt" x="338" y="60">RAPPEL VOLET &#183; POUR CONTRASTER</text>

<path class="prof" d="M371 155
  C371 140, 381 122, 408 116
  C441 108, 486 110, 520 128
  C535 138, 545 146, 550 152
  L547 156
  C528 162, 490 166, 450 164
  C415 162, 385 160, 375 158
  C372 157, 371 156, 371 155 Z"/>
<!-- volet prolonge le BF -->
<path class="vol" d="M550 152 L580 178 L572 185 L547 158 Z"/>
<circle cx="550" cy="155" r="2.5" fill="#b45309"/>
<text class="aerolex-terme" data-slug="volet" x="500" y="198" fill="#b45309" font-size="12">volet</text>
<text class="lb" x="500" y="212" font-size="9.5" fill="#b45309">bord de fuite &#8595;</text>

<!-- portance forte hors titre -->
<line x1="430" y1="118" x2="430" y2="72" stroke="#2563eb" stroke-width="3.5" marker-end="url(#af-b)"/>
<text class="aerolex-terme" data-slug="portance" x="438" y="85" fill="#2563eb" font-size="11">portance &#8593;&#8593;</text>
<!-- tra&#238;n&#233;e sous profil, label au-dessus -->
<text class="aerolex-terme" data-slug="trainee" x="430" y="188" fill="#b45309" font-size="10.5">tra&#238;n&#233;e &#8593;</text>
<line x1="420" y1="172" x2="515" y2="172" stroke="#b45309" stroke-width="2.8" marker-end="url(#af-o)"/>

<text class="lb" x="338" y="240" font-size="10.5" fill="#64748b">But : voler plus lentement en</text>
<text class="lb" x="338" y="254" font-size="10.5" fill="#64748b">gardant (plus) de portance.</text>

<!-- BANDEAU -->
<rect class="cad" x="12" y="270" width="616" height="114" rx="6"/>
<text class="lb" x="24" y="292" font-weight="700">Diff&#233;rence visuelle &#224; retenir :</text>
<text class="lb" x="24" y="312" font-size="11.5"><tspan class="aerolex-terme" data-slug="aerofrein" fill="#dc2626">A&#233;rofrein</tspan> (rouge) : panneau sur l'<tspan class="aerolex-terme" data-slug="extrados">extrados</tspan>, se dresse vers le HAUT &#8594; casse l'&#233;coulement &#8594; portance &#8595;.</text>
<text class="lb" x="24" y="332" font-size="11.5"><tspan class="aerolex-terme" data-slug="volet" fill="#b45309">Volet</tspan> (orange) : panneau au <tspan class="aerolex-terme" data-slug="bord-de-fuite">bord de fuite</tspan>, braque vers le BAS &#8594; cambrure &#8593; &#8594; portance &#8593;.</text>
<text class="lb" x="24" y="354" font-size="11" fill="#64748b">A&#233;rofrein = descendre sans acc&#233;l&#233;rer. &#160; Volet = <tspan class="aerolex-terme" data-slug="hypersustentation" font-size="11">hypersustentation</tspan> pour atterrir lentement.</text>
<text class="lb" x="24" y="372" font-size="10.5" fill="#64748b">M&#233;mo : a&#233;rofrein = g&#226;cher la portance. Volet = aider &#224; porter &#224; basse V.</text>
</svg>
