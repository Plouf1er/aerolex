<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tv" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tv">Volets : hypersustentation &#224; l'atterrissage</title>
<defs>
<marker id="vo-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="vo-o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b45309"/></marker>
<marker id="vo-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
</defs>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.vt{font-family:Arial;font-size:10px;font-weight:700;fill:#475569}
.lb{font-family:Arial;font-size:11.5px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12px;font-weight:700;cursor:pointer}
.prof{fill:#cbd5e1;stroke:#1e3a5f;stroke-width:1.8}
.vol{fill:#f59e0b;stroke:#b45309;stroke-width:1.4}
</style>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="18" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">Volets : hypersustentation</text>
<text x="320" y="34" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#64748b">Plus de portance &#224; basse vitesse &#8212; et plus de tra&#238;n&#233;e</text>

<!-- GAUCHE -->
<rect class="cad" x="12" y="44" width="300" height="204" rx="6"/>
<text class="vt" x="22" y="60">VOLETS RENTR&#201;S &#183; VUE DE C&#212;T&#201;</text>

<!-- Profil classique BA arrondi G, BF pointe D -->
<path class="prof" d="M58 150
  C58 135, 68 118, 95 112
  C130 105, 175 108, 215 122
  C235 130, 250 140, 258 148
  L255 152
  C235 158, 200 162, 160 160
  C120 158, 85 156, 70 154
  C62 153, 58 152, 58 150 Z"/>

<!-- vent -->
<line x1="28" y1="175" x2="90" y2="175" stroke="#16a34a" stroke-width="2" marker-end="url(#vo-g)"/>
<text class="aerolex-terme" data-slug="vent-relatif" x="28" y="190" fill="#16a34a" font-size="10">vent relatif &#8594;</text>

<!-- portance hors profil, label &#224; droite -->
<line x1="155" y1="112" x2="155" y2="78" stroke="#2563eb" stroke-width="2.8" marker-end="url(#vo-b)"/>
<text class="aerolex-terme" data-slug="portance" x="162" y="90" fill="#2563eb" font-size="11">portance</text>
<!-- tra&#238;n&#233;e hors profil, label au-dessus -->
<line x1="165" y1="168" x2="235" y2="168" stroke="#b45309" stroke-width="2.2" marker-end="url(#vo-o)"/>
<text class="aerolex-terme" data-slug="trainee" x="175" y="183" fill="#b45309" font-size="10.5">tra&#238;n&#233;e</text>

<text class="lb" x="22" y="218" font-size="10.5" fill="#64748b">Profil propre : bonne finesse,</text>
<text class="lb" x="22" y="233" font-size="10.5" fill="#64748b">mais Vs plus &#233;lev&#233;e.</text>

<!-- DROITE -->
<rect class="cad" x="328" y="44" width="300" height="204" rx="6"/>
<text class="vt" x="338" y="60">VOLETS SORTIS &#183; VUE DE C&#212;T&#201;</text>

<!-- profil plus bas pour laisser place aux fl&#232;ches en haut -->
<path class="prof" d="M374 155
  C374 140, 384 123, 411 117
  C446 110, 491 113, 526 130
  C538 138, 548 146, 552 152
  L549 156
  C530 162, 490 166, 450 164
  C415 162, 390 160, 380 158
  C376 157, 374 156, 374 155 Z"/>
<!-- volet BF bas, charni&#232;re sur le BF -->
<path class="vol" d="M552 152 L586 178 L578 185 L549 158 Z"/>
<circle cx="552" cy="155" r="2.5" fill="#b45309"/>
<text class="aerolex-terme" data-slug="volet" x="555" y="195" fill="#b45309" font-size="12">volet &#8595;</text>

<!-- portance FORTE : fl&#232;che &#224; gauche du profil pour ne pas toucher le titre -->
<line x1="420" y1="118" x2="420" y2="72" stroke="#2563eb" stroke-width="3.5" marker-end="url(#vo-b)"/>
<text class="aerolex-terme" data-slug="portance" x="338" y="85" fill="#2563eb" font-size="11">portance &#8593;&#8593;</text>
<!-- tra&#238;n&#233;e FORTE : sous le profil, label AU-DESSUS de la fl&#232;che -->
<text class="aerolex-terme" data-slug="trainee" x="430" y="188" fill="#b45309" font-size="10.5">tra&#238;n&#233;e &#8593;&#8593;</text>
<line x1="420" y1="172" x2="515" y2="172" stroke="#b45309" stroke-width="3.2" marker-end="url(#vo-o)"/>

<text class="lb" x="338" y="218" font-size="10.5" fill="#64748b">Cambrure &#8593; &#8594; Cz &#8593; &#224; basse V.</text>
<text class="lb" x="338" y="233" font-size="10.5" fill="#64748b">Tra&#238;n&#233;e aussi &#8593; (freine en finale).</text>

<!-- BANDEAU -->
<rect class="cad" x="12" y="258" width="616" height="126" rx="6"/>
<text class="lb" x="24" y="280" font-weight="700"><tspan class="aerolex-terme" data-slug="volet">Volet</tspan> = surface au <tspan class="aerolex-terme" data-slug="bord-de-fuite">bord de fuite</tspan> qui augmente la cambrure.</text>
<text class="lb" x="24" y="300" font-size="11.5"><tspan class="aerolex-terme" data-slug="hypersustentation">Hypersustentation</tspan> : plus de <tspan class="aerolex-terme" data-slug="portance">portance</tspan> &#224; basse vitesse &#8594; <tspan class="aerolex-terme" data-slug="vitesse-de-decrochage">vitesse de d&#233;crochage</tspan> baisse.</text>
<text class="lb" x="24" y="320" font-size="11.5">Contrepartie : plus de <tspan class="aerolex-terme" data-slug="trainee">tra&#238;n&#233;e</tspan> &#8594; pente plus raide, freinage utile.</text>
<text class="lb" x="24" y="342" font-size="11" fill="#64748b">Usage principal : atterrissage (parfois d&#233;collage, petits braquages).</text>
<text class="lb" x="24" y="362" font-size="11" fill="#64748b">&#9888; Diff&#233;rent de l'a&#233;rofrein : le volet CHERCHE la portance ; l'a&#233;rofrein la d&#233;truit.</text>
</svg>
