<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tin" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tin">L'incidence : angle entre la corde et le vent relatif</title>
<defs>
<marker id="in-g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
<marker id="in-b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
<marker id="in-g2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#16a34a"/></marker>
</defs>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.pr{fill:#cfe0f0;stroke:#1e3a5f;stroke-width:2.1}
.lb{font-family:Arial;font-size:11px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12px;font-weight:700;cursor:pointer}
.corde{stroke:#7c3aed;stroke-width:2.3;stroke-dasharray:7 4}
.hz{stroke:#94a3b8;stroke-width:1.1;stroke-dasharray:5 4}
</style>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="22" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e3a5f">L'incidence : angle entre la corde et le vent relatif</text>
<text x="320" y="40" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Coupe d'aile &#183; descente stabilis&#233;e nez haut : l'assiette &#8800; l'incidence</text>

<!--
  LE on RIGHT, aircraft flies RIGHT-DOWN (descent gamma=+18 deg in SVG).
  Velocity V = (cos18, sin18) &#8776; (0.951, 0.309)
  Relative wind flow direction = -V = left-up; wind COMES FROM ahead-below.

  BA (LE) = (380, 150) rounded
  BF (TE) = (120, 178)
  Chord nose-up: theta &#8776; +6 deg aero
  alpha &#8776; theta - gamma &#8776; 24 deg positive: wind from below chord.

  Wind approach line in FRONT of BA only (no long dash through wing):
  Point far ahead-below on wind line: BA + 85*V = (380+80.8, 150+26.3) = (460.8, 176.3)
  Tip near BA: BA + 18*V = (397, 155.6)

  Chord forward extension (nose direction): from BA along -chord_to_TE unit
  TE-BA = (120-380, 178-150)=(-260,28); BA to forward = -that = (260,-28) unit (0.994,-0.107)
  Forward point: BA + 55*(0.994,-0.107) = (434.7, 144.1)
-->

<rect class="cad" x="12" y="50" width="430" height="248" rx="6"/>
<text x="22" y="68" font-family="Arial" font-size="10.5" font-weight="700" fill="#475569">VUE DE C&#212;T&#201; &#183; COUPE D'AILE EN DESCENTE</text>

<!-- Horizon -->
<line class="hz" x1="28" y1="210" x2="422" y2="210"/>
<text class="lb" x="28" y="224" font-size="9.5" fill="#64748b">horizon</text>

<!-- Profil: BA ARRONDI a droite, BF EFFILE a gauche, cambrure classique -->
<path class="pr" d="M380 150
  C365 128, 330 118, 290 120
  C240 123, 190 140, 150 158
  C135 166, 125 174, 120 178
  C150 180, 200 172, 250 162
  C300 152, 340 148, 365 149
  C372 149.5, 377 150, 380 150 Z"/>

<!-- CORDE -->
<line class="corde" x1="380" y1="150" x2="120" y2="178"/>
<!-- Prolongement corde DEVANT BA seulement -->
<line x1="380" y1="150" x2="435" y2="144" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 3"/>
<text class="aerolex-terme" data-slug="corde" x="210" y="198" fill="#7c3aed">corde</text>

<!-- Bords -->
<circle cx="380" cy="150" r="3.2" fill="#1e3a5f"/>
<text class="lb" x="318" y="134" font-size="10" fill="#1e3a5f" font-weight="700">bord d'attaque</text>
<circle cx="120" cy="178" r="3.2" fill="#1e3a5f"/>
<text class="lb" x="62" y="172" font-size="10" fill="#1e3a5f" font-weight="700">bord de fuite</text>

<!-- VENT RELATIF : UNIQUEMENT devant le BA, vient d'en avant-BAS, fleche vers le BA -->
<!-- Trois petites fleches paralleles pour bien montrer le sens du flux -->
<line x1="462" y1="177" x2="400" y2="157" stroke="#16a34a" stroke-width="3.3" marker-end="url(#in-g)"/>
<line x1="470" y1="168" x2="420" y2="152" stroke="#16a34a" stroke-width="1.8" marker-end="url(#in-g2)" opacity="0.75"/>
<line x1="468" y1="186" x2="418" y2="170" stroke="#16a34a" stroke-width="1.8" marker-end="url(#in-g2)" opacity="0.75"/>
<!-- Segment court pour l'angle (devant BA, sous la corde) -->
<line x1="380" y1="150" x2="455" y2="174" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3"/>

<text class="aerolex-terme" data-slug="vent-relatif" x="400" y="198" fill="#16a34a">vent relatif</text>
<text class="lb" x="400" y="212" font-size="10" fill="#64748b">vient d'en face &#8595;&#8592;</text>

<!-- ARC alpha ENTRE corde (violet haut) et vent (vert bas), DEVANT BA -->
<!-- De ~ direction corde forward (-6deg) a direction vent approach (+18deg) -->
<path d="M418 146 A 40 40 0 0 1 424 168" fill="none" stroke="#dc2626" stroke-width="2.6"/>
<text x="430" y="162" font-family="Arial" font-size="17" font-weight="700" fill="#dc2626">&#945;</text>
<text class="aerolex-terme" data-slug="incidence" x="300" y="100" fill="#dc2626">incidence &#945;</text>
<line x1="355" y1="104" x2="410" y2="148" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>

<!-- Note positive -->
<text class="lb" x="22" y="92" font-size="10.5" fill="#16a34a" font-weight="700">Incidence POSITIVE :</text>
<text class="lb" x="22" y="106" font-size="10" fill="#64748b">le vent attaque par</text>
<text class="lb" x="22" y="118" font-size="10" fill="#64748b">le DESSOUS de la corde.</text>

<!-- TRAJECTOIRE : descente droite-bas, OPPOS&#201;E au vent -->
<line x1="60" y1="248" x2="175" y2="285" stroke="#2563eb" stroke-width="3.3" marker-end="url(#in-b)"/>
<text class="aerolex-terme" data-slug="trajectoire" x="60" y="240" fill="#2563eb">trajectoire</text>
<text class="lb" x="182" y="288" font-size="10" fill="#64748b">descente &#8594;&#8595;</text>

<!-- Petite mention opposition -->
<text class="lb" x="60" y="268" font-size="9.5" fill="#64748b">vent &#8644; trajectoire (sens oppos&#233;s)</text>

<!-- Assiette theta entre horizon et corde -->
<path d="M290 210 A 50 50 0 0 0 286 194" fill="none" stroke="#b45309" stroke-width="1.8"/>
<text x="298" y="206" font-family="Arial" font-size="12" font-weight="700" fill="#b45309">&#952;</text>
<text class="aerolex-terme" data-slug="assiette" x="230" y="232" fill="#b45309" font-size="11">assiette &#952;</text>
<text class="lb" x="230" y="246" font-size="9.5" fill="#64748b">corde / horizon (nez haut)</text>

<!-- CADRE DROIT -->
<rect class="cad" x="452" y="50" width="176" height="248" rx="6"/>
<text x="462" y="70" font-family="Arial" font-size="10.5" font-weight="700" fill="#475569">PI&#200;GE FR&#201;QUENT</text>

<text class="lb" x="462" y="98" font-size="11" font-weight="700">Ne pas confondre :</text>

<text class="aerolex-terme" data-slug="incidence" x="462" y="128" fill="#dc2626" font-size="12">incidence &#945;</text>
<text class="lb" x="462" y="144" font-size="10" fill="#64748b">= corde / vent relatif</text>
<text class="lb" x="462" y="158" font-size="10" fill="#64748b">&#8594; ce qui fait porter</text>
<text class="lb" x="462" y="172" font-size="10" fill="#64748b">r&#233;gl&#233;e au manche</text>

<line x1="468" y1="186" x2="612" y2="186" stroke="#cbd5e1" stroke-width="1"/>

<text class="aerolex-terme" data-slug="assiette" x="462" y="210" fill="#b45309" font-size="12">assiette &#952;</text>
<text class="lb" x="462" y="226" font-size="10" fill="#64748b">= corde / horizon</text>
<text class="lb" x="462" y="240" font-size="10" fill="#64748b">&#8594; lue sur l'ADI</text>

<text class="lb" x="462" y="268" font-size="10.5" fill="#1e3a5f" font-weight="700">Ici : descente nez haut</text>
<text class="lb" x="462" y="282" font-size="10" fill="#64748b">&#952; > 0 mais trajectoire</text>
<text class="lb" x="462" y="296" font-size="10" fill="#64748b">descend &#8594; &#945; &#8800; &#952;</text>

<!-- BANDEAU -->
<rect class="cad" x="12" y="308" width="616" height="64" rx="6"/>
<text class="lb" x="24" y="328" font-size="11.5">Le <tspan class="aerolex-terme" data-slug="vent-relatif">vent relatif</tspan> est exactement OPPOS&#201; &#224; la <tspan class="aerolex-terme" data-slug="trajectoire">trajectoire</tspan>.</text>
<text class="lb" x="24" y="346" font-size="11.5">L'<tspan class="aerolex-terme" data-slug="incidence">incidence</tspan> se mesure entre la <tspan class="aerolex-terme" data-slug="corde">corde</tspan> et ce vent &#8212; jamais par rapport &#224; l'horizon.</text>
<text class="lb" x="24" y="364" font-size="10.5" fill="#64748b">Trop d'incidence &#8594; <tspan class="aerolex-terme" data-slug="decrochage" font-size="10.5">d&#233;crochage</tspan>. L'<tspan class="aerolex-terme" data-slug="assiette" font-size="10.5">assiette</tspan> seule ne dit pas si l'aile porte assez.</text>
<text x="320" y="390" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">Bord d'attaque arrondi &#224; l'avant (droite), bord de fuite effil&#233; &#224; l'arri&#232;re (gauche).</text>
</svg>
