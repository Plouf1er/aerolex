<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tr" style="max-width:100%;width:100%;height:auto;display:block">
<title id="tr">Les trois axes de l'avion au centre de gravit&#233;</title>
<defs>
<marker id="r3-lon" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
<marker id="r3-tr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
<marker id="r3-ver" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
</defs>
<style>
.cad{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
.vt{font-family:Arial;font-size:11px;font-weight:700;fill:#475569}
.av{fill:#94a3b8;stroke:#1e3a5f;stroke-width:1.4;opacity:0.55}
.lb{font-family:Arial;font-size:12px;fill:#1e3a5f}
.aerolex-terme{font-family:Arial;font-size:12.5px;font-weight:700;cursor:pointer}
</style>
<rect width="640" height="400" fill="#e0f2fe" rx="8"/>
<text x="320" y="22" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">Les trois axes de l'avion</text>
<text x="320" y="40" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Tous se croisent au <tspan class="aerolex-terme" data-slug="centre-de-gravite" font-size="12" fill="#64748b">centre de gravit&#233;</tspan></text>

<rect class="cad" x="16" y="52" width="608" height="250" rx="6"/>
<text class="vt" x="28" y="70">VUE 3/4 AVANT &#183; NEZ &#192; DROITE &#183; avion en arri&#232;re-plan</text>

<!-- Avion SIMPLE silhouette 3/4, peu de d&#233;tail, opacity faible -->
<!-- fuselage tube -->
<ellipse class="av" cx="320" cy="175" rx="140" ry="22"/>
<!-- nez conique -->
<path class="av" d="M450 175 L490 168 L490 182 Z"/>
<!-- queue -->
<path class="av" d="M180 175 L155 168 L155 182 Z"/>
<!-- aile gauche (avant bas) -->
<path class="av" d="M300 180 L220 230 L250 235 L340 190 Z"/>
<!-- aile droite (arri&#232;re haut) -->
<path class="av" d="M340 160 L420 115 L450 120 L370 170 Z"/>
<!-- d&#233;rive -->
<path class="av" d="M175 165 L160 115 L185 115 L200 165 Z"/>
<!-- empennage H simple -->
<path class="av" d="M175 175 L145 155 L150 150 L185 168 Z"/>
<path class="av" d="M175 178 L145 200 L150 205 L185 185 Z"/>

<!-- ===== AXES par-dessus, bien visibles ===== -->
<!-- LONGITUDINAL bleu : queue -> nez -->
<line x1="140" y1="175" x2="510" y2="175" stroke="#2563eb" stroke-width="3.2" marker-end="url(#r3-lon)"/>
<!-- arc rotation roulis pr&#232;s du nez -->
<path d="M470 150 A28 28 0 0 1 470 200" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/>
<text class="aerolex-terme" data-slug="roulis" x="478" y="145" fill="#2563eb" font-size="12">longitudinal</text>
<text class="lb" x="478" y="160" font-size="11" fill="#2563eb">= <tspan class="aerolex-terme" data-slug="roulis" fill="#2563eb" font-size="11">roulis</tspan></text>

<!-- TRANSVERSAL vert : aile G -> aile D -->
<line x1="200" y1="240" x2="460" y2="110" stroke="#16a34a" stroke-width="3.2" marker-end="url(#r3-tr)"/>
<path d="M300 145 A24 18 -30 0 1 345 155" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3"/>
<text class="aerolex-terme" data-slug="tangage" x="155" y="255" fill="#16a34a" font-size="12">transversal</text>
<text class="lb" x="155" y="270" font-size="11" fill="#16a34a">= <tspan class="aerolex-terme" data-slug="tangage" fill="#16a34a" font-size="11">tangage</tspan></text>

<!-- VERTICAL rouge -->
<line x1="320" y1="85" x2="320" y2="270" stroke="#dc2626" stroke-width="3.2" marker-end="url(#r3-ver)"/>
<path d="M290 100 A30 30 0 0 1 350 100" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/>
<text class="aerolex-terme" data-slug="lacet" x="355" y="100" fill="#dc2626" font-size="12">vertical</text>
<text class="lb" x="355" y="115" font-size="11" fill="#dc2626">= <tspan class="aerolex-terme" data-slug="lacet" fill="#dc2626" font-size="11">lacet</tspan></text>

<!-- CG par-dessus tout -->
<circle cx="320" cy="175" r="9" fill="#dc2626" stroke="#fff" stroke-width="2"/>
<circle cx="320" cy="175" r="3.5" fill="#fff"/>
<text class="aerolex-terme" data-slug="centre-de-gravite" x="333" y="192" fill="#dc2626" font-size="12">CG</text>

<!-- BANDEAU -->
<rect class="cad" x="16" y="312" width="608" height="72" rx="6"/>
<text class="lb" x="28" y="334" font-weight="700">Les trois axes se croisent au <tspan class="aerolex-terme" data-slug="centre-de-gravite">centre de gravit&#233;</tspan> : l'avion tourne autour du CG.</text>
<text class="lb" x="28" y="354" font-size="11"><tspan fill="#2563eb" font-weight="700">Bleu</tspan> roulis (nez&#8596;queue) &#160;&#183;&#160; <tspan fill="#16a34a" font-weight="700">Vert</tspan> tangage (aile&#8596;aile) &#160;&#183;&#160; <tspan fill="#dc2626" font-weight="700">Rouge</tspan> lacet (haut&#8596;bas).</text>
<text class="lb" x="28" y="372" font-size="10.5" fill="#64748b">Arcs pointill&#233;s = sens de rotation autour de chaque axe.</text>
</svg>
